name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build web (Vite)
        run: cd app && npm ci && npm run build

      - name: Preparar projeto Android (Capacitor)
        run: |
          mkdir -p www && cp -r app/dist/. www/
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Editor de Video" com.mueltec.editor --web-dir www
          npx cap add android

      - name: Adicionar icones ao Android
        run: node android_overlay/launcher_icons.js

      - name: Sincronizar Android
        run: npx cap sync android

      - name: Assinar release (keystore dos secrets)
        run: node android_overlay/release_sign.js
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASS: ${{ secrets.ANDROID_KEY_PASS }}

      - name: Gradle assembleRelease
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: editor-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      # A release v1.0 sempre recebe o APK mais novo (link do README)
      - name: Publicar APK na Release
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk editor-v1.0.apk
          gh release view v1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create v1.0 --repo "$GITHUB_REPOSITORY" --title "Editor v1.0" \
              --notes "APK gerado automaticamente pelo workflow Build APK."
          gh release upload v1.0 editor-v1.0.apk --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
